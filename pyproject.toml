[project]
name = "pastaquote"
version = "0.1.0"
authors = [
  { name="Jason Weiser", email="jason@jasonweiser.com" }
]
description = "Post text lines from a list to social media via the CLI"
dependencies = [
    "requests>=2.31",
    "requests-oauthlib>=1.3",
    "PyYAML>=6.0",
    "atproto>=0.0.50",
]
license = { file="LICENSE" }
requires-python = ">=3.13,<3.15"

[project.scripts]
pastaquote = "pastaquote.bot:main"